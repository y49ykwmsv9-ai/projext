<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Strait — 711 CE | History Education Cut</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1115;color:#e8e1d0;font-family:Georgia,serif;overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%}
#caption{position:fixed;left:5vw;bottom:6vh;max-width:44rem;pointer-events:none;text-shadow:0 2px 12px #000}
.kicker{font:600 12px system-ui;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
h1{font-size:clamp(28px,4vw,56px);margin:.15em 0;font-weight:500}
#caption p{font:16px/1.45 system-ui;max-width:42rem;margin:0;opacity:.9}
#date{position:fixed;right:4vw;top:5vh;font:600 18px system-ui;letter-spacing:.12em}
#credit{position:fixed;right:4vw;bottom:4vh;font:10px system-ui;letter-spacing:.08em;opacity:.5}
#controls{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);display:flex;gap:8px;align-items:center;opacity:.78}
button{background:#111a1fbb;border:1px solid #c8b78a66;color:#eee7d5;padding:7px 12px;border-radius:4px;font:12px system-ui}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="date">711 CE</div>
<div id="caption"><div class="kicker">HISTORY EDUCATION • IBERIA, 711 CE</div><h1 id="headline">The Strait</h1><p id="line">In 711 CE, forces from North Africa crossed into Iberia. This short lesson follows the geography of that opening campaign.</p></div><div id="fact" style="position:fixed;right:4vw;bottom:12vh;max-width:26rem;background:#10171dcc;border:1px solid #c8b78a55;padding:12px 15px;border-radius:6px;font:14px/1.4 system-ui;color:#eee7d5;box-shadow:0 8px 30px #0008"></div>
<div id="credit">CLIOPATRIA • HISTORIX • EDUCATIONAL RECONSTRUCTION • CONTESTED DETAILS MARKED</div>
<div id="controls"><button id="play">Pause</button><button id="restart">Restart</button></div>
<script>
const scene={
  route:[[-5.79,35.78],[-5.55,35.98],[-5.35,36.14],[-5.15,36.28],[-5.9,36.45],[-6.22,36.58],[-5.55,37.2],[-4.78,37.89],[-4.03,39.86]],
  cities:[
   ["Gibraltar",-5.35,36.14,1],["Guadalete",-6.22,36.58,0],["Seville",-5.99,37.39,1],
   ["Córdoba",-4.78,37.89,1],["Toledo",-4.03,39.86,1],["Covadonga",-5.05,43.31,0]
  ]
};
const c=document.getElementById("stage"),ctx=c.getContext("2d");
let W=1600,H=900,dpr=1,playing=true,t0=performance.now(),elapsed=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();
const ease=t=>t*t*(3-2*t);
function cam(t){const k=[{t:0,x:-4.8,y:38.7,z:1},{t:4,x:-5.35,y:36.75,z:1.34},{t:9,x:-5.05,y:37.15,z:1.52},{t:14,x:-4.72,y:38.15,z:1.62},{t:18,x:-4.18,y:39.35,z:1.30},{t:22,x:-4.18,y:39.35,z:1.30}];let a=k[0],b=k[k.length-1];for(let i=0;i<k.length-1;i++)if(t>=k[i].t&&t<=k[i+1].t){a=k[i];b=k[i+1];break}let q=ease(Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t))));return{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q,z:a.z+(b.z-a.z)*q}}
function project(lon,lat,C){const scale=Math.min(W/15,H/14)*C.z;return[(lon-C.x)*scale+W*.5,(C.y-lat)*scale+H*.53]}
function poly(points,C){ctx.beginPath();points.forEach((p,i)=>{const q=project(p[0],p[1],C);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath()}
const iberia=[[-9.30,36.98],[-9.28,37.45],[-9.18,38.05],[-9.12,38.70],[-9.20,39.55],[-9.10,40.15],[-9.25,41.00],[-9.10,41.55],[-8.95,42.10],[-8.55,42.65],[-8.20,43.05],[-7.55,43.35],[-6.85,43.48],[-6.25,43.55],[-5.55,43.55],[-4.85,43.62],[-4.15,43.55],[-3.50,43.40],[-2.95,43.35],[-2.45,43.15],[-1.95,42.95],[-1.65,42.45],[-1.55,41.95],[-1.35,41.45],[-1.05,41.05],[-0.55,40.65],[-0.15,40.20],[0.10,39.75],[0.20,39.30],[0.10,38.85],[0.15,38.40],[0.05,37.95],[-0.15,37.55],[-0.45,37.15],[-0.95,36.75],[-1.45,36.45],[-2.05,36.25],[-2.70,36.15],[-3.35,36.05],[-4.05,36.02],[-4.70,36.05],[-5.25,36.12],[-5.75,36.20],[-6.15,36.35],[-6.55,36.55],[-7.00,36.72],[-7.45,36.78],[-7.95,36.85],[-8.45,36.92],[-8.90,36.96]];
const northAfrica=[[-8.7,35.8],[-7.3,35.8],[-6.3,35.6],[-5.35,35.4],[-4.3,35.2],[-3.0,35.0],[-1.5,34.8],[0,34.6],[2.4,34.0],[2.5,31.6],[-10.5,31.6],[-10.5,35.5]];
function seaTexture(){ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='#8bb3b2';ctx.lineWidth=1;for(let y=0;y<H;y+=18){ctx.beginPath();for(let x=0;x<=W;x+=22){const yy=y+Math.sin(x*.012+y*.035)*3; x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}ctx.restore()}
function relief(C){
  ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#d8cf9c';ctx.lineWidth=1.2;
  const bands=[
    [[-8.8,42.1],[-7.5,42.8],[-6.2,42.7],[-5.0,42.2],[-3.6,42.5],[-2.1,42.0],[-.8,41.8]],
    [[-8.2,40.7],[-7.0,41.4],[-5.7,41.2],[-4.4,40.8],[-3.0,41.1],[-1.7,40.6],[-.4,40.3]],
    [[-7.6,39.3],[-6.4,40.0],[-5.1,39.7],[-3.8,39.4],[-2.4,39.7],[-1.0,39.2]]
  ];
  for(const band of bands){ctx.beginPath();band.forEach((p,i)=>{const q=project(p[0],p[1],C);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke()}
  ctx.restore();
}
function terrain(C){
 ctx.fillStyle='#0b2630';ctx.fillRect(0,0,W,H);seaTexture();
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#193f4b');g.addColorStop(.52,'#0f2f37');g.addColorStop(1,'#091b20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 poly(northAfrica,C);ctx.fillStyle='#3c443b';ctx.fill();poly(iberia,C);ctx.fillStyle='#626b59';ctx.fill();
 ctx.save();ctx.globalAlpha=.28;for(let i=0;i<95;i++){const lon=-9.1+(i*1.173)%9.3,lat=36.5+((i*2.417)%7.0);const q=project(lon,lat,C);const r=18+((i*31)%70);const rg=ctx.createRadialGradient(q[0]-r*.3,q[1]-r*.3,2,q[0],q[1],r);rg.addColorStop(0,'#d6d0a0');rg.addColorStop(1,'#3d4a3d00');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill()}ctx.restore();
 ctx.save();ctx.globalAlpha=.38;ctx.strokeStyle='#c8bd8d';ctx.lineWidth=1;for(let j=0;j<7;j++){ctx.beginPath();for(let i=0;i<95;i++){let lon=-8.7+i*.09,lat=42.7-j*.55+Math.sin(i*.12+j*.7)*.12;const q=project(lon,lat,C);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}ctx.stroke()}ctx.restore();
 ctx.save();ctx.globalAlpha=.55;ctx.strokeStyle='#80a7a0';ctx.lineWidth=2;
 [[[-5.9,42.5],[-5.2,41.7],[-4.9,40.8],[-4.6,39.9],[-4.8,38.5],[-5.2,37.3]],
 [[-1.1,41.6],[-2.0,41.1],[-3.2,40.2],[-4.0,39.4],[-4.8,38.0]]].forEach(arr=>{ctx.beginPath();arr.forEach((p,i)=>{const q=project(p[0],p[1],C);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke()});ctx.restore();
}
function political(C){ctx.save();ctx.globalAlpha=.18;poly(iberia,C);ctx.fillStyle='#a08a5c';ctx.fill();poly([[-6.65,36.30],[-6.20,36.35],[-5.80,36.22],[-5.25,36.12],[-4.70,36.05],[-4.05,36.02],[-3.35,36.05],[-2.70,36.15],[-2.05,36.25],[-1.45,36.45],[-1.15,36.72],[-1.40,36.95],[-2.20,36.72],[-3.10,36.58],[-4.10,36.52],[-5.05,36.55],[-5.75,36.58],[-6.25,36.60]],C);ctx.fillStyle='#7e6b4c';ctx.fill();ctx.restore();}
function route(C,t){const pts=scene.route;ctx.save();ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#d8a34e';ctx.globalAlpha=.8;ctx.setLineDash([9,9]);ctx.lineDashOffset=-t*18;ctx.beginPath();pts.forEach((p,i)=>{const q=project(p[0],p[1],C);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke();ctx.setLineDash([]);ctx.restore();const u=Math.min(1,Math.max(0,(t-1)/9));const idx=Math.min(pts.length-2,Math.floor(u*(pts.length-1)));const f=u*(pts.length-1)-idx;const a=pts[idx],b=pts[idx+1];const p=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];const q=project(p[0],p[1],C);ctx.fillStyle='#f1d79a';ctx.beginPath();ctx.arc(q[0],q[1],6,0,7);ctx.fill()}
function pass(C,lon,lat,name){const q=project(lon,lat,C);ctx.save();ctx.fillStyle='#d7c58b';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(q[0],q[1],3,0,7);ctx.fill();ctx.font='10px system-ui';ctx.fillText(name,q[0]+7,q[1]+3);ctx.restore()}
function cities(C){ctx.save();scene.cities.forEach(([name,lon,lat,tier])=>{const q=project(lon,lat,C);const r=tier?5:3;ctx.fillStyle=tier?'#e9dfbd':'#c4b88e';ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill();if(tier||name==='Guadalete'){ctx.font=tier?'600 13px system-ui':'11px system-ui';ctx.fillStyle='#eee7d4';ctx.fillText(name,q[0]+8,q[1]-7)}});ctx.restore()}
function event(C){const q=project(-6.22,36.58,C);ctx.save();ctx.strokeStyle='#e6c979';ctx.globalAlpha=.85;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(q[0],q[1],18+Math.sin(elapsed*5)*3,0,7);ctx.stroke();ctx.setLineDash([]);ctx.font='10px system-ui';ctx.fillStyle='#e6c979';ctx.fillText('CONTESTED',q[0]+22,q[1]+3);ctx.restore()}
function fleet(C){const q=project(-5.55,35.98,C);ctx.save();for(let i=0;i<5;i++){let x=q[0]+i*12,y=q[1]+Math.sin(i*1.7)*7;ctx.fillStyle='#d5c69b';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+11,y+3);ctx.lineTo(x+2,y+5);ctx.closePath();ctx.fill()}ctx.restore()}
function titleCard(){
  const a=Math.max(0,Math.min(1,(elapsed<1?elapsed:(22-elapsed))*2));
  ctx.save();ctx.globalAlpha=.08*a;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,2);ctx.restore();
}
function grain(){ctx.save();ctx.globalAlpha=.055;for(let i=0;i<900;i++){ctx.fillStyle=Math.random()<.5?'#fff':'#000';ctx.fillRect(Math.random()*W,Math.random()*H,1,1)}ctx.restore()}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'#0000');g.addColorStop(1,'#000b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function draw(){if(playing)elapsed=((performance.now()-t0)/1000)%22;const C=cam(elapsed);terrain(C);relief(C);political(C);route(C,elapsed);fleet(C);cities(C);pass(C,-5.15,42.15,'Pyrenees pass');pass(C,-4.95,37.05,'Guadalete corridor');event(C);titleCard();vignette();grain();const phase=elapsed<4?0:elapsed<9?1:elapsed<14?2:elapsed<18?3:4;
document.getElementById('line').textContent=[
'In 711 CE, a Muslim army crossed the Strait of Gibraltar from North Africa into the Visigothic kingdom of Iberia.',
'The crossing gave the expedition access to southern Iberia. The route shown here is reconstructed from historical geography, not a claim of an exact marching line.',
'The Guadalete episode is traditionally associated with the defeat of King Roderic. The precise battlefield location and details of the engagement remain debated.',
'From southern Iberia, the campaign moved rapidly through major urban corridors, including Córdoba and eventually Toledo, the Visigothic royal center.',
'The key lesson is geographic: straits, roads, rivers, mountain passes, and cities shaped how the campaign could unfold.'
][phase];
document.getElementById('fact').textContent=[
'711 CE • STRAIT OF GIBRALTAR\nNorth Africa → Iberia',
'KEY IDEA • MOVEMENT\nA sea crossing became the first geographic gateway into the peninsula.',
'CONTESTED • GUADALETE\nThe event is well attested, but the exact battlefield geography is debated.',
'CAMPAIGN CORRIDOR\nCórdoba and Toledo illustrate how access to connected urban centers mattered.',
'TAKEAWAY\nHistorical campaigns are shaped by physical geography as much as by armies and rulers.'
][phase];
requestAnimationFrame(draw)}draw();
document.getElementById('play').onclick=()=>{playing=!playing;if(playing)t0=performance.now()-elapsed*1000;document.getElementById('play').textContent=playing?'Pause':'Play'};
document.getElementById('restart').onclick=()=>{elapsed=0;t0=performance.now();playing=true;document.getElementById('play').textContent='Pause'};
</script>
</body></html>

<!doctype html><html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Ironfront Tactics</title><style>body{margin:0;background:#111;color:#eee;font:14px system-ui}button{background:#202a33;color:white;border:1px solid #52606b;border-radius:9px;padding:9px}.app{height:100dvh;display:grid;grid-template-rows:52px 1fr 58px}.top,.bottom{display:flex;align-items:center;gap:8px;padding:8px;background:#151a20}.top span{margin-left:auto}.battle{position:relative;overflow:hidden;background:#59604f}canvas{width:100%;height:100%}.panel{position:absolute;left:8px;top:8px;background:#111b23eF;border:1px solid #56636e;border-radius:12px;padding:10px;width:210px}.right{left:auto;right:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bottom{overflow:auto;white-space:nowrap}.bottom button{min-width:100px}.modal{display:none;position:absolute;inset:5%;background:#111b23f5;border:1px solid #667;border-radius:15px;padding:15px;overflow:auto}.modal.show{display:block}.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}@media(max-width:700px){.right{display:none}}</style><div class='app'><header class='top'><b>IRONFRONT TACTICS</b><span>60 FPS target</span><button onclick='maker()'>Scenario Maker</button></header><main class='battle'><canvas id='c'></canvas><section class='panel'><b>Army Builder</b><div class='grid' id='g'></div><div class='row'><button onclick='forts++'>Fortification</button><button onclick='sieges++'>Siege Equipment</button></div><small id='sel'>Selected: Infantry</small></section><section class='panel right'><b>Battlefield</b><p id='info'>Units: 0<br>Fortifications: 0<br>Siege: 0</p></section><div class='modal' id='m'><h2>Custom Scenario Maker</h2><p>Create battles, defenses, sieges and challenge scenarios.</p><div class='row'><button onclick='challenge(1)'>Bridgehead</button><button onclick='challenge(2)'>Castle Siege</button><button onclick='challenge(3)'>Outnumbered</button><button onclick='challenge(4)'>Armored Clash</button><button onclick='challenge(5)'>Hold the Line</button><button onclick='challenge(6)'>Encirclement</button></div><button onclick='populate()'>Populate Battlefield</button> <button onclick='clearAll()'>Clear</button> <button onclick='m.classList.remove("show")'>Close</button></div></main><footer class='bottom' id='bar'></footer></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let units=[],forts=0,sieges=0,selected='Infantry';const types=['Infantry','Riflemen','MG Team','Tank','Heavy Tank','Artillery','Mortar','AT Gun','Cavalry','Engineer','Rocket Artillery','Flamethrower','Sniper','Recon','Supply','AA Gun','Field Gun','Howitzer','Siege Gun','Armored Car','Horse Artillery','Battering Ram','Catapult','Ballista'];function resize(){c.width=innerWidth*devicePixelRatio;c.height=(innerHeight-110)*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();types.slice(0,10).forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{selected=t;sel.textContent='Selected: '+t};bar.appendChild(b)});types.slice(10).forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{selected=t;sel.textContent='Selected: '+t};g.appendChild(b)});function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const u of units){x.fillStyle=u.side?'#d47777':'#78a7d4';x.beginPath();x.arc(u.x,u.y,7,0,7);x.fill();x.fillStyle='#111';x.font='9px system-ui';x.fillText(u.t,u.x+9,u.y+3)}requestAnimationFrame(draw)}draw();c.onclick=e=>{units.push({x:e.clientX,y:e.clientY,t:selected,side=units.length%2});update()};function update(){info.innerHTML='Units: '+units.length+'<br>Fortifications: '+forts+'<br>Siege: '+sieges}function populate(){for(let i=0;i<40;i++)units.push({x:30+Math.random()*(innerWidth-60),y:70+Math.random()*(innerHeight-150),t:types[i%types.length],side:i%2});update()}function clearAll(){units=[];forts=0;sieges=0;update()}function maker(){m.classList.add('show')}function challenge(n){clearAll();for(let i=0;i<20+n*6;i++)units.push({x:30+Math.random()*(innerWidth-60),y:70+Math.random()*(innerHeight-150),t:types[(i+n)%types.length],side:i%2});forts=n*2;sieges=n;update();m.classList.remove('show')}update()</script></html>

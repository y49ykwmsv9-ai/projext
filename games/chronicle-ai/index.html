<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronicle AI</title>
<style>
body{margin:0;background:#081018;color:#e9eef3;font:14px system-ui}button,textarea{font:inherit}button{background:#172635;color:#fff;border:1px solid #395064;border-radius:8px;padding:8px;cursor:pointer}.app{display:grid;grid-template-rows:52px 1fr 42px;height:100vh}.top,.foot{padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:#0b151f;border-bottom:1px solid #263847}.foot{border-top:1px solid #263847;border-bottom:0;color:#8fa0af;font-size:11px}.main{display:grid;grid-template-columns:240px 1fr 320px;min-height:0}.side{padding:10px;background:#0d1822;border-right:1px solid #263847;overflow:auto}.right{border-right:0;border-left:1px solid #263847}.box{background:#111f2b;border:1px solid #2a3e50;border-radius:9px;padding:10px;margin-bottom:9px}.box h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;color:#9eb0bf}.map{position:relative;background:radial-gradient(circle,#183246,#09131c);overflow:auto}.regions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:80px 12% 260px}.region{min-height:90px}.selected{outline:2px solid #72b7ff}.console{position:absolute;bottom:12px;left:12px;right:12px;background:#0a141eee;border:1px solid #33495b;border-radius:12px;padding:10px}.console textarea{width:100%;min-height:70px;box-sizing:border-box;background:#071018;color:#fff;border:1px solid #344958;border-radius:7px;padding:8px}.actions{display:flex;gap:7px;justify-content:flex-end;margin-top:7px}.event{border:1px solid #293d4e;background:#101d28;border-radius:8px;padding:9px;margin-bottom:7px}.event small{color:#8395a5}.event p{margin:5px 0;color:#cbd6df}.kv{display:grid;grid-template-columns:1fr auto;gap:5px;color:#91a2b1}.kv b{color:#fff}@media(max-width:900px){.main{grid-template-columns:190px 1fr}.right{display:none}}@media(max-width:650px){.main{display:block}.side{display:none}.map{height:calc(100vh - 94px)}}
</style>
<body><div class="app"><header class="top"><b>CHRONICLE <span style="color:#72b7ff">AI</span></b><span id="clock"></span><span><button onclick="preset()">Presets</button> <button onclick="saveNamed()">Save</button></span></header>
<main class="main"><aside class="side"><div class="box"><h3>Campaign</h3><button onclick="preset()">New Campaign</button> <button onclick="loadFile()">Import</button></div><div class="box"><h3>State</h3><div id="state"></div></div><div class="box"><h3>Selected region</h3><div id="sel">None</div></div></aside>
<section class="map"><div class="regions" id="regions"></div><div class="console"><textarea id="cmd" placeholder="Write a government order..."></textarea><div class="actions"><button onclick="advance()">Advance month</button><button onclick="issue()" style="background:#245985">Issue order</button></div></div></section>
<aside class="side right"><div class="box"><h3>Chronicle</h3><div id="feed"></div></div></aside></main><footer class="foot"><span id="save">Autosave active</span><span>Local campaign storage</span></footer></div>
<script>
const KEY="chronicle-ai-campaign-v1";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{date:"1936-01-01",turn:1,player:"Kingdom of Czechoslovakia",cash:100,stability:72,army:58,industry:64,relations:{Germany:-35,Poland:10,France:35,Romania:42,Hungary:-28},selected:null,events:[]};
const regions=["Britain","France","Germany","Poland","Soviet Union","Italy","Balkans","Iberia","Scandinavia","North Africa","Middle East","India"];
function persist(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById("save").textContent="Autosaved "+new Date().toLocaleTimeString()}
function render(){document.getElementById("clock").textContent=S.date+" • Turn "+S.turn;document.getElementById("state").innerHTML='<div class="kv"><span>Government</span><b>'+S.player+'</b><span>Stability</span><b>'+S.stability+'</b><span>Treasury</span><b>'+S.cash+'</b><span>Industry</span><b>'+S.industry+'</b><span>Army</span><b>'+S.army+'</b></div>';document.getElementById("sel").textContent=S.selected||"None";document.getElementById("feed").innerHTML=S.events.slice().reverse().map(e=>'<article class="event"><small>'+e.date+' • '+e.type+'</small><b>'+e.title+'</b><p>'+e.body+'</p></article>').join("")||"<small>No events yet.</small>";document.querySelectorAll(".region").forEach(x=>x.classList.toggle("selected",x.textContent===S.selected))}
function issue(){let t=document.getElementById("cmd").value.trim();if(!t)return;let q=t.toLowerCase(),type=q.includes("treaty")||q.includes("diplom")||q.includes("negot")?"Diplomacy":q.includes("army")||q.includes("military")||q.includes("attack")||q.includes("mobil")?"Military":q.includes("factory")||q.includes("trade")||q.includes("food")||q.includes("tax")?"Economy":q.includes("secret")||q.includes("spy")?"Intelligence":"Governance";let cost=type==="Military"?8:type==="Diplomacy"?4:type==="Economy"?6:3;S.cash=Math.max(0,S.cash-cost);if(type==="Military")S.army=Math.min(100,S.army+4),S.stability=Math.max(0,S.stability-(q.includes("attack")?5:1));if(type==="Economy")S.industry=Math.min(100,S.industry+3);if(type==="Diplomacy")S.stability=Math.min(100,S.stability+1);let target=Object.keys(S.relations).find(x=>q.includes(x.toLowerCase()));if(target)S.relations[target]=Math.max(-100,Math.min(100,S.relations[target]+(type==="Diplomacy"?6:-1)));S.events.push({date:S.date,type,title:type+" order processed",body:"The government order was parsed into a "+type.toLowerCase()+" initiative. Ministries have begun implementation, resources were committed, and affected governments will evaluate the change according to their own interests. Immediate effects are recorded now, while larger consequences can emerge as the campaign advances. "+(target?"The initial foreign target is "+target+".":"No single foreign target was identified.")});document.getElementById("cmd").value="";persist();render()}
function advance(){let d=new Date(S.date+"T00:00:00");d.setMonth(d.getMonth()+1);S.date=d.toISOString().slice(0,10);S.turn++;S.cash=Math.max(0,Math.round(S.cash+S.industry*.08-5));if(Math.random()<.45){let k=Object.keys(S.relations)[Math.floor(Math.random()*Object.keys(S.relations).length)];S.relations[k]=Math.max(-100,S.relations[k]+(Math.random()>.5?2:-2));S.events.push({date:S.date,type:"foreign",title:k+" adjusts its policy",body:k+" has reviewed developments and altered its diplomatic posture. The response is generated independently from the player's command and may develop further over later turns."})}persist();render()}
function preset(){let x=prompt("Preset: 1=1936 Europe, 2=1939 Crisis, 3=Sandbox","1");if(x==="2"){S={...S,date:"1939-09-01",turn:1,player:"Czechoslovak Government",cash:82,stability:61,army:69,industry:71}}else if(x==="3"){S={...S,date:"2026-01-01",turn:1,player:"Republic of the Player",cash:150,stability:80,army:50,industry:70}}else if(x==="1"){S={...S,date:"1936-01-01",turn:1,player:"Kingdom of Czechoslovakia",cash:100,stability:72,army:58,industry:64}}persist();render()}
function saveNamed(){let n=prompt("Save name","Campaign "+S.date);if(n){localStorage.setItem(KEY+"::"+n,JSON.stringify(S));persist()}}
function loadFile(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader;r.onload=()=>{S=JSON.parse(r.result);persist();render()};r.readAsText(i.files[0])};i.click()}
document.getElementById("regions").innerHTML=regions.map(x=>'<button class="region" onclick="S.selected=\''+x+'\';persist();render()">'+x+"</button>").join("");render();persist();
</script></body></html>

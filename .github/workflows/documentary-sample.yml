name: Reconquista Documentary Sample

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/prepare-cliopatria.mjs"
      - "scripts/render-cliopatria-sample.mjs"
      - "projects/documentary/map-style.json"
      - ".github/workflows/documentary-sample.yml"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin curl unzip fonts-dejavu
          python3 -m pip install --user --disable-pip-version-check piper-tts
          mkdir -p voices
          python3 -m piper.download_voices --data-dir voices en_US-lessac-medium
      - name: Fetch and resolve Cliopatria
        run: node scripts/prepare-cliopatria.mjs
      - name: Render 711 sample
        run: node scripts/render-cliopatria-sample.mjs
      - name: Upload sample
        uses: actions/upload-artifact@v7
        with:
          name: reconquista-711-cliopatria-sample
          path: projects/documentary/build/sample/*
          archive: false
          retention-days: 14

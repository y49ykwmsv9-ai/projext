name: Reconquista Documentary Sample

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "scripts/resolve-cliopatria-sample.mjs"
      - "scripts/render-cliopatria-sample.mjs"
      - "scripts/render-711-cinematic-scene.py"
      - ".github/workflows/reconquista-711-cinematic.yml"
      - "projects/documentary/map-style.json"
      - "projects/documentary/data/cliopatria-plus/reconquista-atlas.json"
      - "scripts/validate-reconquista-atlas.mjs"
      - "scripts/cliopatria-plus.mjs"
      - ".github/workflows/documentary-sample.yml"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin curl unzip fonts-dejavu python3-pil
          python3 -m pip install --user --disable-pip-version-check edge-tts
      - name: Render 711 cinematic scene
        run: python3 scripts/render-711-cinematic-scene.py
      - name: Upload 711 cinematic scene
        uses: actions/upload-artifact@v4
        with:
          name: reconquista-711-cinematic-20s
          path: /tmp/reconquista711/reconquista-711-cinematic-20s.mp4
          retention-days: 14
      - name: Upload sample
        uses: actions/upload-artifact@v7
        with:
          name: reconquista-750-cliopatria-sample
          path: projects/documentary/build/sample/reconquista-750-cliopatria-sample.mp4
          archive: false
          retention-days: 14

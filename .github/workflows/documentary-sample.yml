name: Reconquista Documentary Sample

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "scripts/resolve-cliopatria-sample.mjs"
      - "scripts/render-cliopatria-sample.mjs"
      - "scripts/render-711-cinematic-scene.py"
      - ".github/workflows/reconquista-711-cinematic.yml"
      - "projects/documentary/map-style.json"
      - "projects/documentary/data/cliopatria-plus/reconquista-atlas.json"
      - "scripts/validate-reconquista-atlas.mjs"
      - "scripts/cliopatria-plus.mjs"
      - ".github/workflows/documentary-sample.yml"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUDIO_URL: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/3d9c67ba-23df-452d-85f0-f2c3e3f7f078/Reconquista_711_final_cinematic_narration.mp3?_jwt=eyJhbGciOiJIUzI1NiJ9.eyJrZXlIYXNoIjoiZjZiN2VlN2JjNmQzNDc4NSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDIwNjA3NX0.Tv80LjDUyYovd--xAYmbpMFOjM7pXzl4xxXMvIQxnEVE"
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin curl unzip fonts-dejavu python3-pil
      - name: Validate Cliopatria+ Reconquista atlas
        run: node scripts/validate-reconquista-atlas.mjs
      - name: Fetch and resolve Cliopatria
        run: node scripts/resolve-cliopatria-sample.mjs
      - name: Render 750 Cliopatria sample
        run: node scripts/render-cliopatria-sample.mjs
      - name: Render 711 cinematic scene
        run: python3 scripts/render-711-cinematic-scene.py
      - name: Upload 711 cinematic scene
        uses: actions/upload-artifact@v4
        with:
          name: reconquista-711-cinematic-20s
          path: /tmp/reconquista711/reconquista-711-cinematic-20s.mp4
          retention-days: 14
      - name: Upload sample
        uses: actions/upload-artifact@v7
        with:
          name: reconquista-750-cliopatria-sample
          path: projects/documentary/build/sample/reconquista-750-cliopatria-sample.mp4
          archive: false
          retention-days: 14

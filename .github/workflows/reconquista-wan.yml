name: Reconquista Credit-Free AI Video Build
on:
  push:
    paths:
      - "scripts/render-wan-worker.py"
      - "scripts/assemble-wan-documentary.py"
      - ".github/workflows/reconquista-wan.yml"
      - "projects/documentary/scene-assets.json"
  workflow_dispatch:
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 1, end: 10}
          - {start: 11, end: 20}
          - {start: 21, end: 30}
          - {start: 31, end: 40}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check gradio_client
      - name: Generate Wan 2.2 scenes on free ZeroGPU
        env:
          SCENE_START: ${{ matrix.start }}
          SCENE_END: ${{ matrix.end }}
        run: python scripts/render-wan-worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: wan-scenes-${{ matrix.start }}-${{ matrix.end }}
          path: projects/documentary/build/wan/scene-*-wan.mp4
          retention-days: 7
  assemble:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wan-scenes-*
          path: projects/documentary/build/wan
          merge-multiple: true
      - name: Install rendering and neural voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --disable-pip-version-check piper-tts
          mkdir -p voices
          python -m piper.download_voices --data-dir voices en_US-lessac-medium
      - name: Generate researched documentary narration package
        run: node scripts/generate-documentary.mjs
      - name: Assemble 60 minute AI-generated documentary
        run: python scripts/assemble-wan-documentary.py
      - name: Verify final MP4
        run: ffprobe -v error -show_entries format=duration,size -of json projects/documentary/build/reconquista-documentary-60min-wan.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: reconquista-documentary-60min-wan
          path: projects/documentary/build/reconquista-documentary-60min-wan.mp4
          retention-days: 14

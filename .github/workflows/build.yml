name: Worldforge Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache Cliopatria source archive
        uses: actions/cache@v4
        with:
          path: .cache/cliopatria
          key: worldforge-cliopatria-v0.2.0

      - name: Verify environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

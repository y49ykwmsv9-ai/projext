name: Reconquista Sample Scene Render

concurrency:
  group: reconquista-sample-scene
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render-sample-scene.mjs"
      - "projects/documentary/render/scenes/scene-711-v2.html"
      - "projects/documentary/render/scenes/scene-711-v3.html"
      - "projects/documentary/render/scenes/scene-711-v4.html"
      - "projects/documentary/render/scenes/scene-711-v2.json"
      - ".github/workflows/sample-scene-render.yml"

permissions:
  contents: read

jobs:
  render-sample-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm init -y
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Render 711 CE sample scene
        run: SCENE_FILE=scene-711-v4.html node scripts/render-sample-scene.mjs

      - name: Upload rendered sample scene
        uses: actions/upload-artifact@v4
        with:
          name: reconquista-sample-scene-711-v4
          path: projects/documentary/build/sample-scene-711-v4
          retention-days: 14

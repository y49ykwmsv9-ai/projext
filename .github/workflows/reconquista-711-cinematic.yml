name: Build 711 Cinematic Reconquista Scene

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render-711-cinematic-scene.py"
      - ".github/workflows/reconquista-711-cinematic.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAP_URL: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Reconquista_(914-1492).svg"
    steps:
/      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin python3-pil curl fonts-dejavu
          python3 -m pip install --user --disable-pip-version-check edge-tts
      - name: Render event-driven 711 scene
        run: python3 scripts/render-711-cinematic-scene.py
      - name: Upload finished 20 second scene
        uses: actions/upload-artifact@v4
        with:
          name: reconquista-711-cinematic-20s
          path: /tmp/reconquista711/reconquista-711-cinematic-20s.mp4
          retention-days: 14

name: Reconquista Cliopatria Sample

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render-cliopatria-sample.mjs"
      - "scripts/prepare-cliopatria.mjs"
      - "projects/documentary/data/**"
      - "package.json"
      - ".github/workflows/cliopatria-sample.yml"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin curl fonts-dejavu python3-pip
          python3 -m pip install --user --disable-pip-version-check piper-tts
          mkdir -p voices
          python3 -m piper.download_voices --data-dir voices en_US-lessac-medium

      - name: Prepare Cliopatria runtime dataset
        run: node scripts/prepare-cliopatria.mjs

      - name: Render one database-driven sample scene
        run: node scripts/render-cliopatria-sample.mjs

      - name: Upload sample
        uses: actions/upload-artifact@v7
        with:
          name: reconquista-cliopatria-sample
          path: |
            projects/documentary/build/sample/reconquista-711-cliopatria-sample.mp4
            projects/documentary/build/sample/sample-provenance.json
          archive: false
          compression-level: 0
          retention-days: 14

name: MapForge build

on:
  push:
    branches: ["main", "feature/mapforge-studio"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "TYPECHECK_EXIT=${code}" >> "$GITHUB_STEP_SUMMARY"
          exit "${code}"
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapforge-typecheck-${{ github.run_id }}
          path: typecheck.log
          retention-days: 3
      - run: npm run build

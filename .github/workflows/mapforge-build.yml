name: MapForge build
on:
  push:
    branches: ["feature/mapforge-studio"]
  pull_request:
    branches: ["feature/mapforge-studio","main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

name: Build Historical Library

on:
  workflow_dispatch:
  push:
    paths:
      - "data/history-library/**"
      - "data/historical-polities-*.csv"
      - "scripts/build-history-library.py"
      - "scripts/validate-history-library.py"
      - ".github/workflows/history-library-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Cliopatria source snapshot
        run: |
          mkdir -p .history-upstream
          curl -L --fail --retry 3             https://github.com/Seshat-Global-History-Databank/cliopatria/raw/main/cliopatria.geojson.zip             -o .history-upstream/cliopatria.geojson.zip
          unzip -o .history-upstream/cliopatria.geojson.zip -d .history-upstream
          test -s .history-upstream/cliopatria_polities_only.geojson

      - name: Build modular resources
        run: |
          python scripts/build-history-library.py             --cliopatria .history-upstream/cliopatria_polities_only.geojson

      - name: Enforce Cliopatria completeness target
        run: |
          python scripts/validate-history-library.py --require-cliopatria

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-history-library
          path: data/history-library
          retention-days: 30

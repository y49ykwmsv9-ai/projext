name: Build HISTORIX Historical Library

on:
  workflow_dispatch:
  push:
    paths:
      - "data/history-library/**"
      - "data/historical-polities-*.csv"
      - "lib/historical-records.ts"
      - "lib/cliopatria.ts"
      - "scripts/build-history-library.py"
      - "scripts/validate-history-library.py"
      - "scripts/validate-historix-1.1.py"
      - "scripts/validate-historix-1.2.py"
      - "scripts/validate-historix-1.3.py"
      - "scripts/validate-historix-1.4.py"
      - "scripts/build-historix-1.4-polities.py"
      - "scripts/enrich-historix-1.4-wikidata.py"
      - "scripts/enrich-historix-1.4-pass4.py"
      - "scripts/enrich-historix-1.4-pass3.py"
      - "scripts/enrich-historix-1.4-pass2.py"
      - ".github/workflows/history-library-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download pinned Cliopatria source snapshot
        env: {CLIOPATRIA_COMMIT: ad28a691b7c07c1fca89d0e0636d324667d2a258}
        run: |
          mkdir -p .history-upstream
          curl -L --fail --retry 3 "https://github.com/Seshat-Global-History-Databank/cliopatria/raw/$CLIOPATRIA_COMMIT/cliopatria.geojson.zip" -o .history-upstream/cliopatria.geojson.zip
          unzip -o .history-upstream/cliopatria.geojson.zip -d .history-upstream
          test -s .history-upstream/cliopatria_polities_only.geojson
      - name: Build modular HISTORIX resources
        run: python scripts/build-history-library.py --cliopatria .history-upstream/cliopatria_polities_only.geojson
      - name: Enforce Cliopatria completeness target
        run: python scripts/validate-history-library.py --require-cliopatria
      - name: Validate HISTORIX 1.1 graph
        run: python scripts/validate-historix-1.1.py
      - name: Validate HISTORIX 1.2 quantitative layer
        run: python scripts/validate-historix-1.2.py
      - name: Validate HISTORIX 1.3 expanded records
        run: python scripts/validate-historix-1.3.py
      - name: Materialize complete HISTORIX 1.4 polity universe
        run: python scripts/build-historix-1.4-polities.py
      - name: Enrichment pass 1: source-linked Wikidata and Wikipedia
        run: python scripts/enrich-historix-1.4-wikidata.py
      - name: Enrichment pass 2: chronology geography succession and rulers
        run: python scripts/enrich-historix-1.4-pass2.py
      - name: Enrichment pass 3: crosslink existing events people and places
        run: python scripts/enrich-historix-1.4-pass3.py
      - name: Enrichment pass 4: build place-time query index
        run: python scripts/enrich-historix-1.4-pass4.py
      - name: Validate HISTORIX 1.4 complete polity universe
        run: python scripts/validate-historix-1.4.py
      - name: Persist generated 1.4 polity resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history-library/polities data/history-library/graph/place-time-index.json data/history-library/HISTORIX-1.4-manifest.json data/history-library/catalog.json data/history-library/manifests/cliopatria-manifest.json
          git diff --cached --quiet || git commit -m "HISTORIX 1.4: materialize complete 1583 polity universe"
          git push
      - name: Upload HISTORIX library artifact
        uses: actions/upload-artifact@v4
        with:
          name: historix-1.4-library
          path: data/history-library
          retention-days: 30

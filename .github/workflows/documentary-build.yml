name: Reconquista Documentary Build

concurrency:
  group: reconquista-documentary-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-documentary.mjs"
      - "scripts/render-documentary.mjs"
      - "scripts/preflight-documentary-render.mjs"
      - "projects/documentary/**"
      - "data/historical-polities-expansion-v2.csv"
      - ".github/workflows/documentary-build.yml"

jobs:
  render-reconquista:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin curl fonts-dejavu python3-pip
          python3 -m pip install --user --disable-pip-version-check piper-tts
          mkdir -p voices
          python3 -m piper.download_voices --data-dir voices en_US-lessac-medium

      - name: Generate historical documentary package
        run: node scripts/generate-documentary.mjs

      - name: Preflight documentary renderer
        run: node scripts/preflight-documentary-render.mjs

      - name: Validate Reconquista package
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('projects/documentary/build/documentary-manifest.json','utf8'));
          const a=JSON.parse(fs.readFileSync('projects/documentary/scene-assets.json','utf8'));
          if (!/reconquista|iberian/i.test(m.id+' '+m.title)) throw new Error('Wrong documentary package: expected Reconquista/Iberia');
          if (Number(m.targetDurationMinutes)!==60) throw new Error('Target duration is not 60 minutes');
          if (m.chapters?.length!==10) throw new Error('Expected 10 Reconquista chapters');
          if (a.assets.length<40) throw new Error('Expected at least 40 local scene plates');
          for (const x of a.assets) {
            if (!x.imagePath || /runway|cloudfront.net|https?:\\/\\//i.test(x.imagePath)) throw new Error('External/transient scene asset detected: '+x.imagePath);
            if (!fs.existsSync(x.imagePath)) throw new Error('Missing local scene plate: '+x.imagePath);
          }
          const raw=fs.readFileSync('projects/documentary/build/documentary-manifest.json','utf8');
          if (/Runway/i.test(raw)) throw new Error('Runway reference remains in generated documentary manifest');
          if (!/CLIOPATRIA|CLIOPATRA/i.test(raw) || !/HISTORIX/i.test(raw)) throw new Error('Historical provenance missing');
          console.log('Reconquista package validation passed:', a.assets.length, 'local scene plates');
          NODE

      - name: Render 60-minute documentary
        run: node scripts/render-documentary.mjs

      - name: Upload finished MP4
        uses: actions/upload-artifact@v7
        with:
          name: reconquista-documentary-60min
          path: projects/documentary/build/reconquista-documentary-60min.mp4
          archive: false
          compression-level: 0
          retention-days: 14

      - name: Upload source package and credits
        uses: actions/upload-artifact@v7
        with:
          name: reconquista-documentary-sources
          path: |
            projects/documentary/build/documentary-manifest.json
            projects/documentary/build/documentary-script.md
            projects/documentary/build/documentary-shotlist.csv
            projects/documentary/build/render-plan.json
          retention-days: 14

# Renderer pipeline: preflight is mandatory before the production render.

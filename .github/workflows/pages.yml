name: Deploy Ironfront Tactics to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/ironfront-tactics/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Ironfront source
        uses: actions/checkout@v4

      - name: Assemble standalone site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp projects/ironfront-tactics/index.html site/index.html
          cp projects/ironfront-tactics/README.md site/README.md
          cp -R projects/ironfront-tactics/assets site/assets
          cp -R projects/ironfront-tactics/data site/data
          printf '%s\n' "Ironfront Tactics standalone deployment" > site/DEPLOYMENT.txt
          printf '%s\n' "${GITHUB_SHA}" > site/BUILD_COMMIT.txt

      - name: Verify standalone site
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/assets/sprites/unit-atlas.svg
          test -s site/assets/sprites/fortification-atlas.svg
          test -s site/assets/sprites/effects-atlas.svg
          test -s site/data/units.json
          test -s site/data/scenarios.json
          ! grep -qE 'Worldforge|Chronicle AI' site/index.html
          echo "Ironfront standalone site verified."

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Ironfront Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Ironfront to Pages
        id: deployment
        uses: actions/deploy-pages@v4

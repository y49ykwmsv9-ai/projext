name: Deploy Ironfront Tactics Only

on:
  push:
    branches: [main]
    paths:
      - "projects/ironfront-tactics/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ironfront-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove any previous assembled site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

      - name: Assemble Ironfront only
        shell: bash
        run: |
          set -euo pipefail
          cp projects/ironfront-tactics/index.html site/index.html
          cp projects/ironfront-tactics/README.md site/README.md
          cp -R projects/ironfront-tactics/assets site/assets
          cp -R projects/ironfront-tactics/data site/data
          printf '%s\n' "Ironfront Tactics standalone deployment" > site/DEPLOYMENT.txt
          printf '%s\n' "${GITHUB_SHA}" > site/BUILD_COMMIT.txt
          touch site/.nojekyll

      - name: Verify Ironfront-only artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/assets/sprites/unit-atlas.svg
          test -s site/assets/sprites/fortification-atlas.svg
          test -s site/assets/sprites/effects-atlas.svg
          test -s site/data/units.json
          test -s site/data/scenarios.json
          ! grep -qiE 'Worldforge|Chronicle AI' site/index.html
          ! find site -type f -print | grep -qiE 'worldforge|chronicle'
          test "$(find site -maxdepth 1 -type f | wc -l)" -ge 4
          echo "Ironfront-only artifact verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Ironfront artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Ironfront
        id: deployment
        uses: actions/deploy-pages@v4

# Ironfront release pipeline: source-only Pages deployment.

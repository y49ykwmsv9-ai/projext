name: Deploy Worldforge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Cache Cliopatria source archive
        uses: actions/cache@v4
        with:
          path: .cache/cliopatria
          key: worldforge-cliopatria-v0.2.0
      - name: Install dependencies
        run: npm install
      - name: Build static game
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Project Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          set -e
          rm -rf site
          mkdir -p site/documentary
          cp projects/ironfront-tactics/index.html site/index.html
          cp projects/ironfront-tactics/README.md site/README.md
          cp projects/documentary/render/scenes/scene-711-v4.html site/documentary/index.html
          cp projects/documentary/render/scenes/scene-711-education-v1.html site/documentary/scene-711-education-v1.html
          cp projects/documentary/render/scenes/scene-711-education-v2.html site/documentary/scene-711-education-v2.html
          cp projects/documentary/render/education-v1-v2-watch.html site/documentary/education-v1-v2-watch.html
          cp projects/documentary/render/SCENE-BASELINE-v2.md site/documentary/SCENE-BASELINE-v2.md
          cp projects/documentary/render/DOCUMENTARY-VISUAL-QUALITY-GATE-v1.md site/documentary/DOCUMENTARY-VISUAL-QUALITY-GATE-v1.md
          cp projects/documentary/README.md site/documentary/README.md
          cp projects/documentary/HISTORIX-CLIOPATRIA-DESIGN-PASS.md site/documentary/HISTORIX-CLIOPATRIA-DESIGN-PASS.md
          cp projects/documentary/data/cliopatria-plus/reconquista-atlas.json site/documentary/reconquista-atlas.json
          printf '%s\\n' "$GITHUB_SHA" > site/BUILD_COMMIT.txt
          touch site/.nojekyll
      - name: Verify
        run: |
          set -e
          test -s site/index.html
          test -s site/documentary/education-v1-v2-watch.html
          test -s site/documentary/scene-711-education-v1.html
          test -s site/documentary/scene-711-education-v2.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Project Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/documentary/**"
      - "projects/ironfront-tactics/**"
      - "scripts/render-sample-scene.mjs"
      - "projects/documentary/render/scenes/scene-711-education-v2.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm init -y
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Render previous education revision
        run: |
          set -e
          git show HEAD^:projects/documentary/render/scenes/scene-711-education-v2.html > projects/documentary/render/scenes/scene-711-education-v2-previous.html
          SCENE_FILE=scene-711-education-v2-previous.html DURATION_MS=22000 node scripts/render-sample-scene.mjs
      - name: Render education v1
        run: SCENE_FILE=scene-711-education-v1.html DURATION_MS=22000 node scripts/render-sample-scene.mjs
      - name: Render education v2
        run: SCENE_FILE=scene-711-education-v2.html DURATION_MS=22000 node scripts/render-sample-scene.mjs
      - name: Render current education revision
        run: SCENE_FILE=scene-711-education-v2.html DURATION_MS=22000 node scripts/render-sample-scene.mjs
      - name: Assemble site
        run: |
          set -e
          rm -rf site
          mkdir -p site/documentary
          cp projects/ironfront-tactics/index.html site/index.html
          cp projects/ironfront-tactics/README.md site/README.md
          cp -R projects/ironfront-tactics/assets site/assets
          cp -R projects/ironfront-tactics/data site/data
          cp projects/documentary/render/scenes/scene-711-v4.html site/documentary/index.html
          cp projects/documentary/render/scenes/scene-711-education-v1.html site/documentary/scene-711-education-v1.html
          cp projects/documentary/render/scenes/scene-711-education-v2.html site/documentary/scene-711-education-v2.html
          cp projects/documentary/render/scenes/scene-711-v2.json site/documentary/scene-711-v2.json
          cp projects/documentary/render/sample-scene-711.svg site/documentary/sample-scene-711.svg
          cat > site/documentary/sample-scene-711-watch.html <<'HTML'
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconquista Education Cut - Previous Revision vs Current</title>
<style>
body{margin:0;background:#0b0f14;color:#eee;font:16px system-ui,sans-serif}
main{max-width:1500px;margin:auto;padding:24px}
section{display:grid;grid-template-columns:1fr 1fr;gap:16px}
article{background:#111821;padding:12px;border-radius:10px}
video{width:100%;background:#000}
a{color:#9ed0ff}
.badge{font-size:12px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:800px){section{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>The Strait - 711 CE</h1>
<p>Automatic production comparison. Every video-source revision replaces the stable viewer with the immediately preceding revision and the current revision.</p>
<p class="badge">Previous revision vs Current revision • Build $GITHUB_SHA</p>
<section>
<article>
<h2>Previous Revision</h2>
<video controls playsinline preload="metadata" src="sample-scene-711-previous.mp4"></video>
<p><a href="sample-scene-711-previous.mp4">Open previous MP4</a></p>
</article>
<article>
<h2>Current Revision</h2>
<video controls playsinline preload="metadata" src="sample-scene-711.mp4"></video>
<p><a href="sample-scene-711.mp4">Open current MP4</a></p>
</article>
</section>
</main>
</body>
</html>
HTML
          cp projects/documentary/build/sample-scene-711-education-v2-previous/scene-711-education-v2-previous.mp4 site/documentary/sample-scene-711-previous.mp4
          cp projects/documentary/build/sample-scene-711-education-v2/scene-711-education-v2.mp4 site/documentary/sample-scene-711.mp4
          cp projects/documentary/build/sample-scene-711-education-v1/scene-711-education-v1.mp4 site/documentary/reconquista-711-education-v1.mp4
          cp projects/documentary/build/sample-scene-711-education-v2/scene-711-education-v2.mp4 site/documentary/reconquista-711-education-v2.mp4
          cp projects/documentary/render/education-v1-v2-watch.html site/documentary/education-v1-v2-watch.html
          cp projects/documentary/render/SCENE-BASELINE-v2.md site/documentary/SCENE-BASELINE-v2.md
          cp projects/documentary/render/DOCUMENTARY-VISUAL-QUALITY-GATE-v1.md site/documentary/DOCUMENTARY-VISUAL-QUALITY-GATE-v1.md
          cp projects/documentary/README.md site/documentary/README.md
          cp projects/documentary/HISTORIX-CLIOPATRIA-DESIGN-PASS.md site/documentary/HISTORIX-CLIOPATRIA-DESIGN-PASS.md
          cp projects/documentary/data/cliopatria-plus/reconquista-atlas.json site/documentary/reconquista-atlas.json
          printf '%s\n' "$GITHUB_SHA" > site/BUILD_COMMIT.txt
          touch site/.nojekyll
      - name: Verify
        run: |
          set -e
          test -s site/index.html
          test -s site/documentary/sample-scene-711-previous.mp4
          test -s site/documentary/sample-scene-711.mp4
          test -s site/documentary/sample-scene-711-watch.html
          test -s site/documentary/scene-711-education-v2.html
          test -s site/documentary/sample-scene-711-previous.mp4
          test -s site/documentary/sample-scene-711.mp4
          test -s site/documentary/reconquista-711-education-v2.mp4
          grep -q "HISTORIX" site/documentary/index.html
          grep -q "CLIOPATRIA" site/documentary/index.html
          grep -q "RECONSTRUCTED" site/documentary/index.html
          grep -q "CONTESTED" site/documentary/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

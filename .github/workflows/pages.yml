name: Deploy Worldforge and Game Projects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build Worldforge
        env:
          GITHUB_ACTIONS: "true"
        run: npm run build

      - name: Add standalone game projects
        run: |
          mkdir -p out/projects/chronicle-ai
          cp projects/chronicle-ai/index.html out/projects/chronicle-ai/index.html
          cp projects/chronicle-ai/README.md out/projects/chronicle-ai/README.md
          cp projects/chronicle-ai/project.json out/projects/chronicle-ai/project.json

      - name: Add Pages fallback
        run: cp out/index.html out/404.html

      - name: Verify exported site
        run: |
          test -f out/index.html
          test -f out/projects/chronicle-ai/index.html
          test -f out/projects/chronicle-ai/project.json
          echo "Worldforge export and standalone projects verified."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: HISTORIX master-store intake

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-historix-master-intake.py"
      - ".github/workflows/historix-master-intake.yml"

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build HISTORIX master datastore
        run: python scripts/build-historix-master-intake.py
      - name: Validate intake
        run: |
          python - <<'PY'
          import json, sqlite3
          r=json.load(open("data/historix-master/intake_report.json"))
          assert r["unique_polities"] == 1583, r
          c=sqlite3.connect("data/historix-master/historix_master.sqlite")
          assert c.execute("select count(*) from polities").fetchone()[0] == 1583
          print("HISTORIX intake validation passed: 1583 polities")
          PY
      - name: Persist master datastore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historix-master/historix_master.sqlite data/historix-master/intake_report.json
          git diff --cached --quiet || git commit -m "HISTORIX: intake 1583 Cliopatria polities into master store"
          git push
